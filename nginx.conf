server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # TLS ends at the Gateway; absolute redirects would point at http://host:8080.
    absolute_redirect off;

    # comments.barnes.biz serves the Remark42 embed script and its iframe. Blowfish sets
    # inline style attributes, hence 'unsafe-inline' for styles only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://comments.barnes.biz; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://comments.barnes.biz; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
